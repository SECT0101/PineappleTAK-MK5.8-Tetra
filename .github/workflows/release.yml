name: release

# Push a tag like v1.0.0 to publish a release with the ready-to-install module package.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the module
        run: bash tools/build-module.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: Pineapple-TetraTAK-*.tar.gz
