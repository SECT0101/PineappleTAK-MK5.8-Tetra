name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the service and module
        # SC2140: the core intentionally joins quoted XML strings across lines
        run: |
          find pineappletak tools module \( -name '*.sh' -o -path '*/tetra/bin/_pineap' \) -print0 | \
            xargs -0 shellcheck -S warning -e SC2034,SC2155,SC2140,SC1090,SC1091
      - name: PHP, Python and JavaScript syntax
        run: |
          php -l module/PineappleTAK/api/module.php
          find pineappletak -name '*.py' -print0 | xargs -0 python3 -m py_compile
          python3 -m py_compile pineappletak/tetra/bin/sqlite3
          find pineappletak -path '*/web/static/*.js' ! -path '*/leaflet/*' -print0 | xargs -0 -n1 node --check
          node --check module/PineappleTAK/js/module.js
